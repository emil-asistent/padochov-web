server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # relativní Location -> nerozbije se https za Cloudflare tunelem
    absolute_redirect off;
    port_in_redirect off;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # poptávkový formulář -> node (server.js)
    location ^~ /api/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # čisté URL: /kontakt.html -> /kontakt (stejně jako cleanUrls na Vercelu)
    location = /index.html { return 308 /; }
    location ~ ^/(.+)\.html$ { return 308 /$1; }

    # odkaz zkopírovaný s koncovým lomítkem musí dojít na stejnou stránku, ne na 404
    location ~ ^/(.+)/$ { return 301 /$1; }

    # vlastní 404 ve vzhledu webu (musí mít absolutní cesty k assetům)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # video se může měnit -> kratší cache, bez immutable
    location ~* \.(mp4|webm)$ {
        expires 7d; add_header Cache-Control "public"; try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|woff|woff2|ttf|ico|pdf)$ {
        expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }

    location / { try_files $uri $uri.html $uri/index.html $uri/ =404; }
}
